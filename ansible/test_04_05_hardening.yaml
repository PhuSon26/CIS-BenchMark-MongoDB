---
# Test playbook: chi chay hardening CIS 04 (4.1/4.2) + 05 (5.1/5.3/5.4), khong dong den 02.
# Dung cho Ubuntu 24.04 single-node.
# Chay: ansible-playbook -i inventory_single.ini test_04_05_hardening.yaml
- name: Test CIS 04 + 05 hardening (changes /etc/mongod.conf, restarts mongod)
  hosts: mongo_test
  become: true
  gather_facts: false
  tasks:
    - name: "CIS 4.1/4.2 | Transport Encryption hardening"
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: 04_transport_encryption.yaml

    - name: "CIS 5.1/5.3/5.4 | Logging hardening"
      ansible.builtin.include_role:
        name: cis_hardening
        tasks_from: 05_logging.yaml
