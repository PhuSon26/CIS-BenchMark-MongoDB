# CIS 1.1 - MongoDB Software Version / Patching
- name: "CIS 1.1 | Validate target MongoDB version"
  ansible.builtin.assert:
    that:
      - mongodb_target_version is defined
      - mongodb_target_version | length > 0
    fail_msg: "MongoDB target version must be explicitly defined."

- name: "CIS 1.1 | Update APT package cache"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: "CIS 1.1 | Install approved MongoDB version"
  ansible.builtin.apt:
    name: "mongodb-org={{ mongodb_target_version }}"
    state: present
    allow_downgrade: false

- name: "CIS 1.1 | Restart MongoDB service"
  ansible.builtin.systemd:
    name: mongod
    state: restarted

- name: "CIS 1.1 | Wait for MongoDB service"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 27017
    state: started
    timeout: 120

- name: "CIS 1.1 | Verify installed MongoDB version"
  ansible.builtin.command:
    argv:
      - mongosh
      - --quiet
      - --eval
      - "db.version()"
  register: cis_1_1_hardened_version
  changed_when: false

- name: "CIS 1.1 | Validate MongoDB version"
  ansible.builtin.assert:
    that:
      - cis_1_1_hardened_version.stdout | trim == mongodb_target_version
    fail_msg: "MongoDB version verification failed."
    success_msg: "MongoDB version successfully verified."