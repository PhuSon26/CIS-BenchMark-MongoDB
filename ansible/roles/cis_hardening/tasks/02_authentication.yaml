### CIS 2.1 ###
- name: "CIS 2.1 | Ensure keyfile exists"
  ansible.builtin.stat:
    path: /etc/mongodb/keyfile
  register: mongodb_keyfile

- name: "CIS 2.1 | Validate keyfile permissions"
  ansible.builtin.assert:
    that:
      - mongodb_keyfile.stat.exists
      - mongodb_keyfile.stat.pw_name == "mongodb"
      - mongodb_keyfile.stat.gr_name == "mongodb"
      - mongodb_keyfile.stat.mode == "0400"
    fail_msg: "MongoDB keyfile is missing or has incorrect ownership/permissions."

- name: "CIS 2.1 | Configure authentication and keyfile"
  ansible.builtin.blockinfile:
    path: /etc/mongod.conf
    marker: "# {mark} ANSIBLE MANAGED SECURITY"
    insertafter: EOF
    backup: true
    block: |
      security:
        keyFile: /etc/mongodb/keyfile
        authorization: enabled
  register: security_config_result

- name: "CIS 2.1 | Validate MongoDB configuration"
  ansible.builtin.command:
    argv:
      - mongod
      - --config
      - /etc/mongod.conf
      - --outputConfig
  changed_when: false
  no_log: true

- name: "CIS 2.1 | Restart MongoDB when configuration changes"
  ansible.builtin.systemd:
    name: mongod
    state: restarted
  when: security_config_result.changed

- name: "CIS 2.1 | Wait for MongoDB port"
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 27017
    state: started
    timeout: 90
  when: security_config_result.changed

- name: "CIS 2.1 | Check MongoDB service status"
  ansible.builtin.command: systemctl is-active mongod
  register: mongod_service
  changed_when: false

- name: "CIS 2.1 | Display hardening result"
  ansible.builtin.debug:
    msg:
      node: "{{ inventory_hostname }}"
      authentication_configured: true
      remediation_performed: "{{ security_config_result.changed }}"
      mongodb_service: "{{ mongod_service.stdout }}"
### CIS 2.2 ###
- name: "CIS 2.2 | Disable localhost authentication bypass"
  ansible.builtin.blockinfile:
    path: /etc/mongod.conf
    marker: "# {mark} ANSIBLE MANAGED CIS 2.2"
    insertafter: EOF
    backup: true
    block: |
      setParameter:
        enableLocalhostAuthBypass: false
  register: localhost_bypass_config_result
  notify: Restart MongoDB

- name: "CIS 2.2 | Validate MongoDB configuration"
  ansible.builtin.command:
    argv:
      - mongod
      - --config
      - /etc/mongod.conf
      - --outputConfig
  changed_when: false
