- name: "CIS 1.1 | Collect MongoDB server version"
  ansible.builtin.command:
    argv:
      - mongod
      - --version
  register: cis_1_1_server_version
  changed_when: false
  failed_when: false

- name: "CIS 1.1 | Display collected evidence"
  ansible.builtin.debug:
    msg:
      control: "1.1"
      recomendation: "Ensure the appropriate MongoDB software version/patches are installed"
      node: "{{ inventory_hostname }}"
      server_version: >-
        {{ cis_1_1_server_version.stdout | default('NOT_FOUND') }}
      assessment: "REVIEW_REQUIRED"
      remediation_performed: false