- name: "CIS 2.1 | Collect authentication configuration"
  ansible.builtin.shell: |
    grep -Eq '^[[:space:]]*authorization:[[:space:]]*["'\'']?enabled["'\'']?[[:space:]]*$' /etc/mongod.conf
  register: auth_check
  changed_when: false
  failed_when: false

- name: "CIS 2.1 | Display audit result"
  ansible.builtin.debug:
    msg:
      control: "2.1"
      node: "{{ inventory_hostname }}"
      assessment: "{{ 'PASS' if auth_check.rc == 0 else 'FAIL' }}"
      remediation_performed: false