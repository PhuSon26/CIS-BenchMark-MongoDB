### CIS 2 Authentication ###
### CIS 2.1 Ensure Authentication is configured (Automated) ###
- name: "CIS 2.1 | Collect authentication configuration"
  ansible.builtin.shell: |
    grep -Eq '^[[:space:]]*authorization:[[:space:]]*["'\'']?enabled["'\'']?[[:space:]]*$' /etc/mongod.conf
  register: cis_2_1_auth_check
  changed_when: false
  failed_when: false

- name: "CIS 2.1 | Display audit result"
  ansible.builtin.debug:
    msg:
      control: "2.1"
      node: "{{ inventory_hostname }}"
      assessment: "{{ 'PASS' if cis_2_1_auth_check.rc == 0 else 'FAIL' }}"
      remediation_performed: false

### CIS 2.2 Ensure that MongoDB does not bypass authentication via the localhost exception (Automated) ###
- name: "CIS 2.2 | Collect localhost excepion configuration"
  ansible.builtin.shell:
    cat /etc/mongod.conf |grep "enableLocalhostAuthBypass"
  register: cis_2_1_localhost_bypass_check
  changed_when: false
  failed_when: false

- name: "CIS 2.2 | Display audit result"
  ansible.builtin.debug:
    msg:
      control: "2.2"
      node: "{{ inventory_hostname }}"
      assessment: "{{ 'PASS' if cis_2_1_localhost_bypass_check.stdout is search('enableLocalhostAuthBypass:\\s*false') else 'FAIL' }}"
      remediation_performed: false