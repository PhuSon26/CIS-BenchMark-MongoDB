- name: Install Python and requires packages
  ansible.builtin.raw: |
    if ! command -v python3 >/dev/null 2>&1 ||
       ! dpkg -s python3-apt python3-pip python3-venv >/dev/null 2>&1; then
      apt-get update &&
      DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-apt python3-pip python3-venv
      echo "PYTHON_PACKAGES_INSTALLED"
    fi
  register: python_install_result
  changed_when: "'PYTHON_PACKAGES_INSTALLED' in python_install_result.stdout"