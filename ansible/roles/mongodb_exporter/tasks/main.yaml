- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - tar
    state: present
    update_cache: true

- name: Create MongoDB Exporter system user
  ansible.builtin.user:
    name: "{{ mongodb_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Download MongoDB Exporter binary archive
  ansible.builtin.get_url:
    url: "https://github.com/percona/mongodb_exporter/releases/download/v{{ mongodb_exporter_version }}/mongodb_exporter-{{ mongodb_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/mongodb_exporter.tar.gz
    mode: "0644"

- name: Extract MongoDB Exporter archive
  ansible.builtin.unarchive:
    src: /tmp/mongodb_exporter.tar.gz
    dest: /tmp/mongodb_exporter_extracted
    remote_src: true
    creates: /tmp/mongodb_exporter_extracted

- name: Find MongoDB Exporter executable
  ansible.builtin.find:
    paths: /tmp/mongodb_exporter_extracted
    patterns: mongodb_exporter
    file_type: file
    recurse: true
  register: exporter_binary

- name: Install MongoDB Exporter executable
  ansible.builtin.copy:
    src: "{{ exporter_binary.files[0].path }}"
    dest: /usr/local/bin/mongodb_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: exporter_binary.matched | int > 0

- name: Verify MongoDB Exporter binary
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mongodb_exporter
      - --version
  changed_when: false

- name: Configure MongoDB Exporter systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/mongodb_exporter.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=MongoDB Prometheus Exporter
      After=network-online.target mongod.service
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ mongodb_exporter_user }}
      Environment="MONGODB_URI={{ mongodb_exporter_uri }}"
      ExecStart=/usr/local/bin/mongodb_exporter --web.listen-address=:{{ mongodb_exporter_port }}
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Restart MongoDB Exporter

- name: Enable and start MongoDB Exporter
  ansible.builtin.systemd:
    name: mongodb_exporter
    enabled: true
    state: started
    daemon_reload: true