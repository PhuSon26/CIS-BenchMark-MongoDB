- name: Install MongoDB Server
  hosts: mongodb_nodes
  become: true
  roles: 
   - mongodb_install

- name: Install Python
  hosts: mongodb_nodes
  become: true
  roles: 
   - python_install

- name: Configure MongoDB Replica Set
  hosts: mongodb_nodes
  become: true
  roles: 
   - mongodb_replica_set

- name: Install MongoDB Exporter
  hosts: mongodb_nodes
  become: true
  roles: 
   - mongodb_exporter